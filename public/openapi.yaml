openapi: 3.1.0
info:
  title: KeenVector API
  version: "1.0"
  summary: Send WhatsApp and email messages, connect channels, and drive website chat and forms.
  description: |
    **This spec documents only endpoints that exist in the backend today.** Two surfaces:

    - **Message API** (`message-api`) — your server calls it with an API key
      (`Authorization: Bearer kv_live_…`): send and list messages, connect WhatsApp and
      Instagram accounts.
    - **Website public API** (`tenant-site`) — anonymous, keyed by your site's slug: what the
      chat widget and your site's contact form call from the browser.

    Everything you do in the KeenVector console (workflows, campaigns, email domains, webhook
    registration, API keys, your outbound webhook endpoint) uses the console's own session and
    is not part of this API — see [Overview](/api/).

    Response bodies of the Message API currently use Go-style field names (`ID`, `Status`, …);
    they move to snake_case before general availability ([Versioning](/api/versioning)).
  contact:
    name: KeenVector
    url: https://keenvector.in
  license:
    name: Proprietary
    url: https://keenvector.in/terms

servers:
  - url: https://api.keenvector.in
    description: Placeholder — the production host isn't published yet; your KeenVector contact gives you the base URL.
  - url: http://localhost:8085
    description: Local development (message-api).

tags:
  - name: Messages
    description: Send and list messages. WhatsApp (free text) and email are live.
  - name: Connections
    description: Connect your WhatsApp Business Account or Instagram professional account with an API key. The console's Integrations page does the same for people.
  - name: Website (public)
    description: Anonymous endpoints of your published website — lead form and chat. Served by a different host from the Message API.
  - name: Health
    description: Liveness probe.

security:
  - bearerAuth: []

paths:
  /v1/messages:
    post:
      operationId: sendMessage
      tags: [Messages]
      summary: Send a message
      description: |
        Queues the message for the connected account on `channel` and returns `202` with the
        stored message (`Status: QUEUED`). `QUEUED` means accepted, not delivered — poll
        `GET /v1/messages` for `SENT` or `FAILED`.

        - `whatsapp`: free text only; it reaches the recipient only within 24 hours of their
          last message to you (Meta's customer-service window). Templates can't be sent through
          this API yet.
        - `email`: needs a verified sending domain (console → Email domains); `subject` is
          required. Sent from `no-reply@<your domain>`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              whatsapp:
                summary: WhatsApp free text
                value: { channel: whatsapp, to: "919876543210", body: "Hi! Your order #4471 has shipped." }
              email:
                summary: Email
                value: { channel: email, to: "asha@example.com", subject: "Order #4471 shipped", body: "Your order is on its way." }
      responses:
        '202':
          description: Accepted and queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              examples:
                queued:
                  value:
                    ID: e6b4ce10-d887-4b22-8e5a-e4892eff8546
                    TenantID: 8f14e45f-ceea-4c9d-b2fa-6ac1f4b5a2b0
                    IdempotencyKey: order-4471-shipped
                    Channel: whatsapp
                    To: "919876543210"
                    Subject: ""
                    Body: "Hi! Your order #4471 has shipped."
                    Status: QUEUED
                    ProviderMessageID: ""
                    Error: ""
                    CreatedAt: "2026-09-30T09:42:07Z"
        '400':
          description: Invalid request. Some validation errors are still plain text rather than the JSON error shape — handle both.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
            text/plain:
              schema: { type: string, example: "channel, to and body are required" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: The message could not be queued. Nothing was sent — retry with the same Idempotency-Key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listMessages
      tags: [Messages]
      summary: List messages
      description: Your tenant's messages, newest first. Page with `before` = the last `ID` you received.
      parameters:
        - name: before
          in: query
          description: Return messages older than this message id.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          description: Page size, 1–200 (default 50).
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Message' } }
        '400':
          description: "`before` isn't a message id (plain text body)."
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /whatsapp/connections:
    post:
      operationId: connectWhatsApp
      tags: [Connections]
      summary: Connect a WhatsApp Business Account
      description: Stores your WABA credentials. Calling it again with a new `access_token` replaces the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectWhatsAppRequest' }
      responses:
        '201':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppConnection' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: getWhatsAppConnection
      tags: [Connections]
      summary: Get the WhatsApp connection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: disconnectWhatsApp
      tags: [Connections]
      summary: Disconnect WhatsApp
      description: Deletes the stored access token. The token stays valid at Meta until you revoke it there.
      responses:
        '204': { description: Disconnected. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /instagram/connections:
    post:
      operationId: connectInstagram
      tags: [Connections]
      summary: Connect an Instagram professional account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectInstagramRequest' }
      responses:
        '201':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstagramConnection' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: getInstagramConnection
      tags: [Connections]
      summary: Get the Instagram connection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstagramConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: disconnectInstagram
      tags: [Connections]
      summary: Disconnect Instagram
      responses:
        '204': { description: Disconnected. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /public/sites/{slug}:
    servers:
      - url: https://sites.keenvector.in
        description: Placeholder host of the website public API (tenant-site); locally http://localhost:8083.
    get:
      operationId: getPublicSite
      tags: [Website (public)]
      summary: Get a published site
      description: The published site config the widget and tenant pages render. Cached for 60 seconds.
      security: []
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  config: { type: object, description: The published SiteConfig. }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/sites/{slug}/leads:
    servers:
      - url: https://sites.keenvector.in
        description: Placeholder host of the website public API (tenant-site); locally http://localhost:8083.
    post:
      operationId: createLead
      tags: [Website (public)]
      summary: Submit the contact form
      description: |
        Stores the lead, files it under the matching contact and starts your **Form Submitted**
        workflows. Give at least a phone or an email. `website` is a honeypot: leave it empty
        (a filled one is accepted and silently dropped).
      security: []
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadRequest' }
      responses:
        '202':
          description: |
            Accepted. Usually no body. When the phone already belongs to someone who has messaged you on
            WhatsApp, the body asks the visitor to prove it by sending `verify_code` from `claim_address`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verify_code: { type: string }
                  claim_address: { type: string }
                  claim_kind: { type: string, example: whatsapp }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/sites/{slug}/chat:
    servers:
      - url: https://sites.keenvector.in
        description: Placeholder host of the website public API (tenant-site); locally http://localhost:8083.
    post:
      operationId: sendChatMessage
      tags: [Website (public)]
      summary: Send a website chat message
      description: |
        One visitor message. Pass the same `session_id` for a conversation and, from the second
        message on, the `session_token` you got back in the `X-Chat-Token` header. Rate limited
        to 20 requests per minute per IP. When your workflows handle the web channel the reply
        arrives asynchronously (`queued: true`) — poll the session; otherwise the AI assistant
        answers inline.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: X-Chat-Token
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, session_id]
              properties:
                message: { type: string }
                session_id: { type: string }
      responses:
        '200':
          description: Answered inline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  handoff: { type: boolean }
                  session_token: { type: string }
        '202':
          description: Queued for your workflows — poll for the reply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  session_token: { type: string }
        '404': { description: "Site not found, or chat is disabled for it (`chat_disabled`)." }
        '429': { description: Too many requests from this IP. }

  /public/sites/{slug}/chat/{session}:
    servers:
      - url: https://sites.keenvector.in
        description: Placeholder host of the website public API (tenant-site); locally http://localhost:8083.
    get:
      operationId: pollChat
      tags: [Website (public)]
      summary: Poll a chat session for replies
      description: Bot replies after `after` (a message id). Rate limited to 240 requests per minute per IP.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - { name: session, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string, format: uuid } }
        - { name: X-Chat-Token, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        text: { type: string }
                        at: { type: string, format: date-time }

  /healthz:
    get:
      operationId: health
      tags: [Health]
      summary: Liveness
      security: []
      responses:
        '200': { description: Healthy. }
        '503': { description: Not ready (e.g. database unreachable). }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: kv_live_...
      description: |
        `Authorization: Bearer <api_key>`. Business admins create and revoke keys in the
        console — see [Authentication](/api/authentication). Server-side only: the Message API
        sends no CORS headers.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Reusing a key within 2 hours returns the original message instead of sending again.
        Use one key per business event (e.g. `order-4471-shipped`) and reuse it on every retry —
        not a fresh random value per attempt. See [Idempotency](/api/idempotency).
      schema: { type: string, example: order-4471-shipped }
    Slug:
      name: slug
      in: path
      required: true
      description: Your published site's address, e.g. `acme-bakery`.
      schema: { type: string }

  schemas:
    SendMessageRequest:
      type: object
      required: [channel, to, body]
      properties:
        channel: { type: string, enum: [whatsapp, email] }
        to:
          type: string
          description: WhatsApp — international format, digits only (`919876543210`). Email — an address.
        subject:
          type: string
          description: Required for `email`; rejected for `whatsapp`.
        body: { type: string }

    Message:
      type: object
      description: |
        Field names are Go-style today and will move to snake_case before GA. Known issue: `Subject`
        reads back empty from `GET /v1/messages` and idempotent replays (the stored value is correct).
      properties:
        ID: { type: string, format: uuid }
        TenantID: { type: string, format: uuid }
        IdempotencyKey: { type: string }
        Channel: { type: string, enum: [whatsapp, email] }
        To: { type: string }
        Subject: { type: string }
        Body: { type: string }
        Status: { type: string, enum: [QUEUED, SENT, FAILED] }
        ProviderMessageID: { type: string }
        Error: { type: string }
        CreatedAt: { type: string, format: date-time }

    ConnectWhatsAppRequest:
      type: object
      required: [waba_id, phone_number_id, access_token]
      properties:
        waba_id: { type: string }
        phone_number_id: { type: string }
        access_token:
          type: string
          description: A permanent System User token (the 24-hour token from API Setup only suits a quick test).

    WhatsAppConnection:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        waba_id: { type: string }
        phone_number_id: { type: string }
        status: { type: string, example: CONNECTED }

    ConnectInstagramRequest:
      type: object
      required: [ig_user_id, access_token]
      properties:
        ig_user_id: { type: string }
        access_token: { type: string }

    InstagramConnection:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        ig_user_id: { type: string }
        status: { type: string, example: CONNECTED }

    LeadRequest:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, description: Any format; non-digits are stripped. }
        email: { type: string }
        message: { type: string }
        website: { type: string, description: Honeypot — leave empty. }

    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
          description: Stable, machine-readable. See [Errors](/api/errors).
        message:
          type: string
          description: Human-readable; says what to do next.

  responses:
    InvalidRequest:
      description: A field failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            invalid_request:
              value: { error_code: invalid_request, message: "waba_id, phone_number_id and access_token are required" }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            missing_api_key:
              value: { error_code: missing_api_key, message: "Authorization: Bearer <api_key> header is required" }
            invalid_api_key:
              value: { error_code: invalid_api_key, message: "the api key is invalid or revoked" }
    NotFound:
      description: Not found for your tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
