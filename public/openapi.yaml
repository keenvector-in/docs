openapi: 3.1.0
info:
  title: KeenVector API
  version: "1.0"
  summary: Multi-channel messaging API — WhatsApp today, SMS/email/Instagram/Slack planned.
  description: |
    KeenVector is a technology provider, not a sender in its own name: you connect your own
    channel account (e.g. a WhatsApp Business Account), KeenVector routes the API call,
    verifies provider signatures, and tracks delivery.

    **This spec documents only endpoints that exist in the backend today.** Two auth
    patterns currently coexist:

    - `POST/GET /v1/messages` (the `message-api` service) is the one endpoint meant for
      external callers — it requires a real `Authorization: Bearer` API key.
    - Every other path here (`/whatsapp/*`, `/campaigns/*`, `/webhooks/*`, `/keys`, `/verify`)
      is served by an internal service that currently trusts a plain `X-Tenant-ID` header
      instead of the API key — a stand-in the code itself calls out as not-yet-real auth
      (`// Tenant comes from the X-Tenant-ID header — a stand-in for the real auth
      middleware, which does not exist yet`). They are included so the shape is documented,
      but tagged **Preview** and are not yet safe to expose to the public internet behind a
      real tenant boundary.

    SMS, Email, Instagram, Slack, RCS, voice and push are **on the roadmap** — the `channel`
    field on `POST /v1/messages` already reserves the enum values, but only `whatsapp` is
    implemented. Contacts, Media, Organizations/Tenant self-service and Analytics have no
    HTTP surface yet (tenant management is gRPC-internal only). See the
    [Quickstart](/api/quickstart) and [API overview](/api/) for the human-readable version
    of this same map.
  contact:
    name: KeenVector
    url: https://keenvector.in
  license:
    name: Proprietary

servers:
  - url: https://api.keenvector.in
    description: >-
      Placeholder. The platform is not publicly hosted yet — your account team gives you
      the real base URL for your environment. Paths below are correct; the host is not.

tags:
  - name: Messages
    description: Send and list messages through the unified `/v1/messages` endpoint. The only endpoint with real tenant-key auth today.
  - name: WhatsApp
    description: Connect a WhatsApp Business Account and send/list WhatsApp messages. **Preview** — see the auth note above.
  - name: Templates
    description: Manage WhatsApp message templates (submit for Meta approval, list approval status). **Preview**.
  - name: Campaigns
    description: Bulk-send an approved template to many recipients. **Preview**.
  - name: Webhook Configuration
    description: Register your provider app secret and inspect recently received inbound events. **Preview**.
  - name: Webhook Receiver
    description: The endpoints Meta/Slack themselves call — not endpoints you call from your integration.
  - name: Outbound Webhooks
    description: KeenVector's own webhook delivery to your endpoint (internal event fan-out). **Preview**.
  - name: API Keys
    description: Issue, list and revoke API keys. **Internal today** — called by the signup flow, not yet exposed for tenant self-service.
  - name: Health
    description: Liveness/readiness probes, one per service.

security:
  - bearerAuth: []

paths:
  /v1/messages:
    post:
      operationId: sendMessage
      tags: [Messages]
      summary: Send a message
      description: |
        Sends through the connected channel account for `channel`. A `201` means the
        request was accepted and forwarded — not that the provider delivered it. Poll
        `GET /v1/messages` or check [Webhooks](/api/webhooks) for the delivery outcome.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              whatsapp:
                summary: WhatsApp free-form text
                value:
                  channel: whatsapp
                  to: "919876543210"
                  body: "Hi! Your order #4471 has shipped."
      responses:
        '201':
          description: Accepted and forwarded to the channel provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                sent:
                  value:
                    ID: e6b4ce10-d887-4b22-8e5a-e4892eff8546
                    TenantID: 8f14e45f-ceea-4c9d-b2fa-6ac1f4b5a2b0
                    IdempotencyKey: order-4471-confirmation
                    Channel: whatsapp
                    To: "919876543210"
                    Body: "Hi! Your order #4471 has shipped."
                    Status: SENT
                    ProviderMessageID: wamid.HBgMOTE...
                    Error: ""
                    CreatedAt: "2026-09-06T09:42:07Z"
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The provider rejected the request outright (not the same as a `FAILED` status on an accepted message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                send_failed:
                  value: { error_code: send_failed, message: "provider returned 470: recipient has not opted in" }
    get:
      operationId: listMessages
      tags: [Messages]
      summary: List messages
      description: Lists the caller's tenant's messages, newest first.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /whatsapp/connections:
    post:
      operationId: connectWhatsApp
      tags: [WhatsApp]
      summary: Connect a WhatsApp Business Account
      description: |
        Stores your WABA credentials. Calling this again with a new `access_token` rotates
        it in place — there is no separate rotate endpoint.
      security: [{ tenantHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectWhatsAppRequest'
      responses:
        '204':
          description: Connected.
        '400':
          $ref: '#/components/responses/InvalidRequest'
    get:
      operationId: getWhatsAppConnection
      tags: [WhatsApp]
      summary: Get the current connection
      security: [{ tenantHeader: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppConnection'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: disconnectWhatsApp
      tags: [WhatsApp]
      summary: Disconnect
      description: Deletes the stored access token. The token stays valid at Meta until revoked there too.
      security: [{ tenantHeader: [] }]
      responses:
        '204':
          description: Disconnected.

  /whatsapp/messages:
    post:
      operationId: sendWhatsAppText
      tags: [WhatsApp]
      summary: Send free-form text directly (channel-specific route)
      description: |
        Equivalent to `POST /v1/messages` with `"channel": "whatsapp"`, called on the
        whatsapp service directly rather than through message-api. Only reaches a customer
        within 24h of their last message to you.
      security: [{ tenantHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, body]
              properties:
                to: { type: string, example: "919876543210" }
                body: { type: string, example: "Hi! Your order has shipped." }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppMessageEvent' }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/WhatsAppNotConnected'
        '502':
          $ref: '#/components/responses/ProviderError'
    get:
      operationId: listWhatsAppMessages
      tags: [WhatsApp]
      summary: List WhatsApp send events
      security: [{ tenantHeader: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WhatsAppMessageEvent' }

  /whatsapp/messages/template:
    post:
      operationId: sendWhatsAppTemplate
      tags: [WhatsApp]
      summary: Send an approved template message
      description: |
        The only kind of message that can reach a customer with no open 24h session.
        `language_code` defaults to `en_US` if omitted — Meta's auto-provisioned
        `hello_world` template only works from Meta's own test number
        (`#131058` if you try it from your real number); submit your own template first.
      security: [{ tenantHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, template_name]
              properties:
                to: { type: string, example: "919876543210" }
                template_name: { type: string, example: order_confirmation }
                language_code: { type: string, example: en_US, default: en_US }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppMessageEvent' }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/WhatsAppNotConnected'
        '502':
          $ref: '#/components/responses/ProviderError'

  /whatsapp/templates:
    get:
      operationId: listWhatsAppTemplates
      tags: [Templates]
      summary: List templates and their approval status
      description: Straight from Meta — not cached or stored on our side.
      security: [{ tenantHeader: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Template' }
        '409':
          $ref: '#/components/responses/WhatsAppNotConnected'
    post:
      operationId: submitWhatsAppTemplate
      tags: [Templates]
      summary: Submit a new template for Meta's approval
      description: |
        `components` follows Meta's own template-components schema and is passed through
        unmodified — see
        [Meta's template docs](https://developers.facebook.com/docs/whatsapp/business-management-api/message-templates).
      security: [{ tenantHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, language, components]
              properties:
                name: { type: string, example: order_confirmation }
                category: { type: string, example: UTILITY }
                language: { type: string, example: en_US }
                components:
                  type: array
                  items: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/WhatsAppNotConnected'

  /campaigns:
    post:
      operationId: createCampaign
      tags: [Campaigns]
      summary: Create a campaign
      security: [{ tenantHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                template_name: { type: string }
                language_code: { type: string }
                recipients:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400':
          $ref: '#/components/responses/InvalidRequest'
    get:
      operationId: listCampaigns
      tags: [Campaigns]
      summary: List campaigns
      security: [{ tenantHeader: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Campaign' }

  /campaigns/{campaignID}:
    get:
      operationId: getCampaign
      tags: [Campaigns]
      summary: Get a campaign
      security: [{ tenantHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/CampaignID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404':
          $ref: '#/components/responses/NotFound'

  /campaigns/{campaignID}/targets:
    get:
      operationId: listCampaignTargets
      tags: [Campaigns]
      summary: List a campaign's recipients and per-recipient status
      security: [{ tenantHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/CampaignID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CampaignTarget' }
        '404':
          $ref: '#/components/responses/NotFound'

  /campaigns/{campaignID}/trigger:
    post:
      operationId: triggerCampaign
      tags: [Campaigns]
      summary: Send the campaign's template to every recipient
      description: Blocks until every recipient's send attempt finishes.
      security: [{ tenantHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/CampaignID'
      responses:
        '200':
          description: OK — campaign after triggering.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/tenants/{tenantID}/webhook-config/{provider}:
    post:
      operationId: registerWebhookConfig
      tags: [Webhook Configuration]
      summary: Register your provider app secret
      description: |
        Stores your app secret (never as plaintext) and returns a `verify_token` — paste
        it plus `callback_url` into your own provider App's webhook settings. KeenVector
        never sees your provider App's dashboard.
      security: [{ tenantHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantIDPath'
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_secret]
              properties:
                app_secret: { type: string, description: "From your provider App's dashboard (e.g. Meta App Settings → Basic)." }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookConfig' }
        '400':
          $ref: '#/components/responses/InvalidRequest'
    get:
      operationId: getWebhookConfig
      tags: [Webhook Configuration]
      summary: View your current webhook config
      description: Never returns `app_secret` — it stays write-only.
      security: [{ tenantHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantIDPath'
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookConfig' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWebhookConfig
      tags: [Webhook Configuration]
      summary: Disconnect a webhook
      security: [{ tenantHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantIDPath'
        - $ref: '#/components/parameters/Provider'
      responses:
        '204':
          description: Disconnected.

  /webhooks/tenants/{tenantID}/webhook-config/{provider}/recent:
    get:
      operationId: listRecentWebhookEvents
      tags: [Webhook Configuration]
      summary: Last 20 verified inbound events
      description: |
        The only trustworthy connectivity test — KeenVector cannot fabricate a signed
        request that proves anything about your own secret. Trigger a real event from your
        provider's dashboard, then check this endpoint.
      security: [{ tenantHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantIDPath'
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookEvent' }

  /webhooks/{provider}/{tenantID}:
    get:
      operationId: verifyWebhookHandshake
      tags: [Webhook Receiver]
      summary: Provider GET handshake (Meta-style only)
      description: |
        Called by Meta/Instagram during webhook setup with `hub.verify_token` — not an
        endpoint your own integration calls. Slack has no GET step (404s here); it verifies
        via the first POST body instead.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/TenantIDPath'
        - name: hub.verify_token
          in: query
          required: true
          schema: { type: string }
        - name: hub.challenge
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Echoes `hub.challenge` back.
          content:
            text/plain: { schema: { type: string } }
        '403':
          description: Verify token mismatch.
        '404':
          description: Provider not found, or doesn't support a GET handshake.
    post:
      operationId: receiveWebhookCallback
      tags: [Webhook Receiver]
      summary: Provider event callback
      description: >-
        Called by Meta/Slack directly, signed with your app secret. Not an endpoint your own
        integration calls.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/TenantIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Accepted (or, for Slack's `url_verification` handshake, echoes the challenge).
        '403':
          description: Signature verification failed.

  /outbound-webhooks/endpoints:
    post:
      operationId: setOutboundWebhookEndpoint
      tags: [Outbound Webhooks]
      summary: Set your event-delivery endpoint
      security: [{ tenantHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, secret]
              properties:
                url: { type: string, format: uri }
                secret: { type: string, description: Used to HMAC-sign delivered payloads. }
      responses:
        '204':
          description: Saved.
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /outbound-webhooks/events:
    post:
      operationId: enqueueOutboundWebhookEvent
      tags: [Outbound Webhooks]
      summary: Enqueue an event for delivery
      security: [{ tenantHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, payload]
              properties:
                event_type: { type: string }
                payload: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Accepted for delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /outbound-webhooks/deliveries:
    get:
      operationId: listOutboundWebhookDeliveries
      tags: [Outbound Webhooks]
      summary: List delivery attempts
      security: [{ tenantHeader: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookDelivery' }

  /keys:
    post:
      operationId: issueApiKey
      tags: [API Keys]
      summary: Issue a tenant's first API key
      description: |
        **Internal.** Called by the signup flow once a tenant exists. The raw key is
        returned exactly once — only its hash is stored. Self-serve key management from a
        dashboard is planned but not live.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string, example: kv_live_xxxxxxxxxxxxxxxxxxxx }
        '400':
          $ref: '#/components/responses/InvalidRequest'
    get:
      operationId: listApiKeys
      tags: [API Keys]
      summary: List a tenant's keys
      description: "**Internal.**"
      security: []
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }

  /keys/revoke:
    post:
      operationId: revokeApiKey
      tags: [API Keys]
      summary: Revoke an API key
      description: "**Internal.** Revocation is immediate — the key stops working on the caller's very next request."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string }
      responses:
        '204':
          description: Revoked.
        '404':
          $ref: '#/components/responses/NotFound'

  /verify:
    post:
      operationId: verifyApiKey
      tags: [API Keys]
      summary: Resolve an API key to a tenant
      description: "**Internal.** Called by message-api (and every future public-facing service) before trusting a request's claimed tenant."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /healthz:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Liveness/readiness probe
      description: Every service exposes this on its own port. Not on the public API surface.
      security: []
      responses:
        '200':
          description: Healthy.
        '503':
          description: Not ready (e.g. database unreachable).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: kv_live_... / kv_test_...
      description: |
        `Authorization: Bearer <api_key>`. The only real tenant-auth mechanism in the
        platform today. See [Authentication](/api/authentication).
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: >-
        **Development stand-in, not production auth.** The handler comment in every
        service that uses this header says so directly: "a stand-in for the real auth
        middleware, which does not exist yet." Treated here as a distinct scheme from
        `bearerAuth` so Scalar's "Try it" doesn't imply these routes are API-key protected.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Reusing the same key for the same tenant within 24h returns the original result
        instead of sending again. Pick a key naturally unique to the business event (an
        order id), not a fresh random value per attempt.
      schema: { type: string, example: order-4471-confirmation }
    TenantIDPath:
      name: tenantID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampaignID:
      name: campaignID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [whatsapp, instagram, slack] }

  schemas:
    SendMessageRequest:
      type: object
      required: [channel, to, body]
      properties:
        channel:
          type: string
          description: Only `whatsapp` is implemented; other values are reserved for planned channels.
          enum: [whatsapp]
        to:
          type: string
          description: Recipient in international format, digits only.
          example: "919876543210"
        body:
          type: string
          example: "Hello!"

    Message:
      type: object
      properties:
        ID: { type: string, format: uuid }
        TenantID: { type: string, format: uuid }
        IdempotencyKey: { type: string }
        Channel: { type: string, example: whatsapp }
        To: { type: string }
        Body: { type: string }
        Status: { type: string, enum: [QUEUED, SENT, FAILED] }
        ProviderMessageID: { type: string }
        Error: { type: string }
        CreatedAt: { type: string, format: date-time }

    ConnectWhatsAppRequest:
      type: object
      required: [waba_id, phone_number_id, access_token]
      properties:
        waba_id: { type: string }
        phone_number_id: { type: string }
        access_token:
          type: string
          description: A temporary token (24h) from API Setup, or a permanent System User token for anything beyond testing.

    WhatsAppConnection:
      type: object
      properties:
        WABAID: { type: string }
        PhoneNumberID: { type: string }
        Status: { type: string, enum: [CONNECTED, REAUTH_REQUIRED] }

    WhatsAppMessageEvent:
      type: object
      properties:
        ID: { type: string, format: uuid }
        TenantID: { type: string, format: uuid }
        To: { type: string }
        Type: { type: string, enum: [text, template] }
        ProviderMessageID: { type: string }
        CreatedAt: { type: string, format: date-time }

    Template:
      type: object
      properties:
        Name: { type: string }
        Category: { type: string }
        Language: { type: string }
        Status: { type: string, enum: [PENDING, APPROVED, REJECTED] }

    Campaign:
      type: object
      properties:
        ID: { type: string, format: uuid }
        TenantID: { type: string, format: uuid }
        Name: { type: string }
        TemplateName: { type: string }
        LanguageCode: { type: string }
        Status: { type: string, enum: [DRAFT, TRIGGERED, COMPLETED] }
        CreatedAt: { type: string, format: date-time }

    CampaignTarget:
      type: object
      properties:
        Recipient: { type: string }
        Status: { type: string, enum: [PENDING, SENT, FAILED] }
        ProviderMessageID: { type: string }
        Error: { type: string }

    WebhookConfig:
      type: object
      properties:
        callback_url: { type: string, example: /webhooks/whatsapp/8f14e45f-ceea-4c9d-b2fa-6ac1f4b5a2b0 }
        verify_token: { type: string }

    WebhookEvent:
      type: object
      properties:
        Provider: { type: string, example: whatsapp }
        ProviderMessageID: { type: string }
        Status: { type: string, example: delivered, description: "sent | delivered | read | failed for status events; message type for inbound; APPROVED/REJECTED for template status" }
        OccurredAt: { type: string, format: date-time }
        ReceivedAt: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      properties:
        ID: { type: string, format: uuid }
        EventType: { type: string }
        Status: { type: string, enum: [PENDING, DELIVERED, FAILED] }
        Attempts: { type: integer }
        CreatedAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
          description: Stable, public. See [Error handling](/api/errors) for the full table.
        message:
          type: string

  responses:
    InvalidRequest:
      description: The request body or a field failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            invalid_request:
              value: { error_code: invalid_request, message: 'field "channel" failed validation' }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            missing_api_key:
              value: { error_code: missing_api_key, message: "Authorization: Bearer <api_key> header is required" }
            invalid_api_key:
              value: { error_code: invalid_api_key, message: "the api key is invalid or revoked" }
    NotFound:
      description: The resource doesn't exist for this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    WhatsAppNotConnected:
      description: No WhatsApp Business Account connected for this tenant yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            whatsapp_not_connected:
              value: { error_code: whatsapp_not_connected, message: "connect a WhatsApp Business Account before sending" }
    ProviderError:
      description: KeenVector reached the provider and it rejected the request outright.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            provider_error:
              value: { error_code: provider_error, message: "provider returned 470" }
